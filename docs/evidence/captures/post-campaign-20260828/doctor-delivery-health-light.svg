<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="394" viewBox="0 0 1920 394" role="img">
  <title>doctor-delivery-health — light</title>
  <desc>Real Floati scratch-ledger terminal capture.</desc>
  <rect width="1920" height="394" fill="#f7f3eb"/>
  <text x="28" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" xml:space="preserve">
    <tspan x="28" dy="0" fill="#20252c">ROOT=/private/tmp/floati-captures.LtNmwM/doctor</tspan>
    <tspan x="28" dy="19" fill="#20252c">SOURCE=/private/tmp/floati-captures.LtNmwM/source</tspan>
    <tspan x="28" dy="19" fill="#20252c">$ floati doctor --root $ROOT --source $SOURCE --probe --probe-budget 1</tspan>
    <tspan x="28" dy="19" fill="#20252c"></tspan>
    <tspan x="28" dy="19" fill="#20252c">DELIVERY HEALTH</tspan>
    <tspan x="28" dy="19" fill="#853d07">+ OK   architect-codex: 0 undelivered, no drain on record, RED threshold 15m</tspan>
    <tspan x="28" dy="19" fill="#20252c">    RULED</tspan>
    <tspan x="28" dy="19" fill="#853d07">+ OK   builder-claude: 0 undelivered, no drain on record, RED threshold 15m</tspan>
    <tspan x="28" dy="19" fill="#20252c">    RULED</tspan>
    <tspan x="28" dy="19" fill="#853d07">! RED  reviewer-opencode: 1 undelivered, oldest 16m, no drain on record, RED</tspan>
    <tspan x="28" dy="19" fill="#20252c">    threshold 15m RULED</tspan>
    <tspan x="28" dy="19" fill="#20252c"></tspan>
    <tspan x="28" dy="19" fill="#20252c">LOOPBACK PROBE</tspan>
    <tspan x="28" dy="19" fill="#853d07">+ PASS  architect-codex: PASS: loopback probe drained in 1 tick(s)</tspan>
    <tspan x="28" dy="19" fill="#853d07">! DEAF  builder-claude: DEAF: loopback probe not drained within 1s budget</tspan>
    <tspan x="28" dy="19" fill="#853d07">! DEAF  reviewer-opencode: DEAF: loopback probe not drained within 1s budget</tspan>
    <tspan x="28" dy="19" fill="#20252c"></tspan>
    <tspan x="28" dy="19" fill="#20252c">STATE DEGRADED — one or more delivery paths require attention</tspan>
  </text>
</svg>
