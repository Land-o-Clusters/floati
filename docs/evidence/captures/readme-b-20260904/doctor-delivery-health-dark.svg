<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="394" viewBox="0 0 1920 394" role="img">
  <title>doctor-delivery-health — dark</title>
  <desc>Real Floati scratch-ledger terminal capture.</desc>
  <rect width="1920" height="394" fill="#12161c"/>
  <text x="28" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" xml:space="preserve">
    <tspan x="28" dy="0" fill="#d8dee9">ROOT=&lt;scratch&gt;</tspan>
    <tspan x="28" dy="19" fill="#d8dee9">SOURCE=&lt;scratch&gt;</tspan>
    <tspan x="28" dy="19" fill="#d8dee9">$ floati doctor --root $ROOT --source $SOURCE --probe --probe-budget 1</tspan>
    <tspan x="28" dy="19" fill="#d8dee9"></tspan>
    <tspan x="28" dy="19" fill="#d8dee9">DELIVERY HEALTH</tspan>
    <tspan x="28" dy="19" fill="#ff9f43">+ OK   architect-codex: 0 undelivered, no drain on record, RED threshold 15m</tspan>
    <tspan x="28" dy="19" fill="#d8dee9">    RULED</tspan>
    <tspan x="28" dy="19" fill="#ff9f43">! RED  builder-floati: 1 undelivered, oldest 17m, no drain on record, RED</tspan>
    <tspan x="28" dy="19" fill="#d8dee9">    threshold 15m RULED</tspan>
    <tspan x="28" dy="19" fill="#ff9f43">+ OK   reviewer-opencode: 0 undelivered, no drain on record, RED threshold 15m</tspan>
    <tspan x="28" dy="19" fill="#d8dee9">    RULED</tspan>
    <tspan x="28" dy="19" fill="#d8dee9"></tspan>
    <tspan x="28" dy="19" fill="#d8dee9">LOOPBACK PROBE</tspan>
    <tspan x="28" dy="19" fill="#ff9f43">+ PASS  architect-codex: PASS: loopback probe drained in 1 tick(s)</tspan>
    <tspan x="28" dy="19" fill="#ff9f43">! DEAF  builder-floati: DEAF: loopback probe not drained within 1s budget</tspan>
    <tspan x="28" dy="19" fill="#ff9f43">! DEAF  reviewer-opencode: DEAF: loopback probe not drained within 1s budget</tspan>
    <tspan x="28" dy="19" fill="#d8dee9"></tspan>
    <tspan x="28" dy="19" fill="#d8dee9">STATE DEGRADED — one or more delivery paths require attention</tspan>
  </text>
</svg>
