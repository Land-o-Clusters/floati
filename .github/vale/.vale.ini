# Prose lint for the public README. Rules in styles/Floati come from the
# humanizer's "signs of AI writing" list; proselint and write-good are fetched by `vale sync`.
StylesPath = styles
MinAlertLevel = suggestion
Packages = proselint, write-good
Vocab = Floati

[*.md]
BasedOnStyles = Floati, proselint, write-good
# A capability cell whose only text is the dash links to the receipt that has no measurement yet; it is data, not punctuation.
TokenIgnores = (\[—\]\([^)]+\))
write-good.E-Prime = NO
