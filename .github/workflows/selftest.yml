name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run full artifact selftest
        run: python3 -m floati.selftest
